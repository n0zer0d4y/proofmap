name: CI

# Every push to any branch runs CI; documentation-only changes do not.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'CITATION.cff'
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    # A normal run takes about 5 minutes; the limit stops a hung step early.
    timeout-minutes: 30
    # The oldest supported toolchain and the newest tested one: the two ends of the supported range.
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - leanprover/lean4:v4.35.0
          - leanprover/lean4:v4.28.0
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install toolchain
        run: elan toolchain install "${{ matrix.toolchain }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install viewer dependencies (schema validator, live-reload test)
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: viewer
      - name: Build package, check APIs, build fixture, check extraction and serve
        run: bash .github/scripts/ci-lean.sh "${{ matrix.toolchain }}"
        env:
          PROOFMAP_E2E: "1"

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    # A normal run takes about 7 minutes; the limit stops a hung step early.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:types
      - run: npm test
      - run: npm run build
      - name: The committed template matches the build
        run: git diff --exit-code -- ../lean/assets/viewer.html
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests (Chromium, Firefox, WebKit)
        run: npm run e2e
        env:
          ALL_BROWSERS: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: viewer.html
          path: viewer/dist/index.html
          if-no-files-found: error
